<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

            { sna: '高雄車站(建國二路)', sarea: '三民區', ar: '建國二路318號前', sbi: 25, bemp: 5, act: '1' },
            { sna: '捷運中央公園站(1號出口)', sarea: '苓雅區', ar: '中山一路/民生二路口', sbi: 16, bemp: 8, act: '1' },
            { sna: '高雄市立圖書館總館', sarea: '前鎮區', ar: '新光路61號前', sbi: 19, bemp: 11, act: '1' },
            { sna: '駁二大義站', sarea: '鹽埕區', ar: '駁二大義倉庫群旁', sbi: 5, bemp: 15, act: '1' },
            { sna: '捷運三多商圈站(2號出口)', sarea: '前鎮區', ar: '中山二路/三多四路口', sbi: 13, bemp: 12, act: '1' },
            { sna: '輕軌高雄展覽館站', sarea: '前鎮區', ar: '成功二路/林森四路口', sbi: 10, bemp: 14, act: '1' },
            { sna: '捷運左營站(2號出口)', sarea: '左營區', ar: '高鐵路/重信路口', sbi: 28, bemp: 12, act: '1' },
            { sna: '生態園區站(2號出口)', sarea: '左營區', ar: '博愛三路/孟子路口', sbi: 9, bemp: 11, act: '1' },
            { sna: '文化中心站(3號出口)', sarea: '苓雅區', ar: '和平一路/中正二路口', sbi: 17, bemp: 7, act: '1' },
            { sna: '衛武營國家藝術文化中心', sarea: '鳳山區', ar: '三多一路/南京路口', sbi: 21, bemp: 9, act: '1' },
            { sna: '捷運鳳山西站(1號出口)', sarea: '鳳山區', ar: '自由路/澄清路口', sbi: 14, bemp: 10, act: '1' },
            { sna: '高雄市立美術館', sarea: '鼓山區', ar: '美術館路/美術東二路口', sbi: 16, bemp: 14, act: '1' },
            { sna: '輕軌美術館站', sarea: '鼓山區', ar: '美術館路/馬卡道路口', sbi: 12, bemp: 8, act: '1' },
            { sna: '捷運凹子底站(4號出口)', sarea: '鼓山區', ar: '博愛二路/至聖路口', sbi: 20, bemp: 10, act: '1' },
            { sna: '捷運信義國小站(1號出口)', sarea: '新興區', ar: '中正三路/錦田路口', sbi: 11, bemp: 13, act: '1' },
            { sna: '文化中心(和平一路)', sarea: '苓雅區', ar: '和平一路116號前', sbi: 15, bemp: 9, act: '1' },
            { sna: '捷運後驛站(1號出口)', sarea: '三民區', ar: '博愛一路/察哈爾一街口', sbi: 13, bemp: 11, act: '1' },
            { sna: '國立高雄科技大學(建工校區)', sarea: '三民區', ar: '建工路415號前', sbi: 24, bemp: 6, act: '1' },
            { sna: '捷運草衙站(1號出口)', sarea: '前鎮區', ar: '翠亨南路/中安路口', sbi: 18, bemp: 12, act: '1' },
            { sna: '捷運小港站(3號出口)', sarea: '小港區', ar: '沿海一路/漢民路口', sbi: 15, bemp: 15, act: '1' },
            { sna: '捷運世運站(1號出口)', sarea: '楠梓區', ar: '世運大道/左楠路口', sbi: 10, bemp: 10, act: '1' },
            { sna: '國立高雄大學(圖資館)', sarea: '楠梓區', ar: '高雄大學路700號', sbi: 22, bemp: 18, act: '1' },
            { sna: '捷運岡山車站(1號出口)', sarea: '岡山區', ar: '中山南路/岡燕路口', sbi: 16, bemp: 8, act: '1' },
            { sna: '輕軌哈瑪星站', sarea: '鼓山區', ar: '臨海新路/鼓山一路口', sbi: 14, bemp: 16, act: '1' },
            { sna: '旗津海水浴場', sarea: '旗津區', ar: '廟前路/海岸路口', sbi: 8, bemp: 12, act: '1' },
            { sna: '高雄流行音樂中心(音浪塔)', sarea: '鹽埕區', ar: '真愛路/海邊路口', sbi: 12, bemp: 18, act: '1' }
        ];

        let rawYouBikeData = [];
        let currentStations = [];
        let updateTimerInterval;
        let secondsLeft = 60;

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            initIcons();
            initEventListeners();
            renderAttractions('ALL');
            fetchYouBikeData();
            startCountdown();
        });

        function initIcons() {
            lucide.createIcons();
        }

        async function fetchYouBikeData() {
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            const statusText = document.getElementById('data-status-text');

            try {
                // Primary Public Kaohsiung YouBike Open API endpoint
                const apiUrl = 'https://api.kcg.gov.tw/api/service/Get/b4dd9c40-9e10-4822-b984-9842a2202b37';
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const response = await fetch(apiUrl, { signal: controller.signal }).catch(() => null);
                clearTimeout(timeoutId);

                if (response && response.ok) {
                    const result = await response.json();
                    let dataArray = [];
                    
                    if (result.data && Array.isArray(result.data)) {
                        dataArray = result.data;
                    } else if (Array.isArray(result)) {
                        dataArray = result;
                    }

                    if (dataArray.length > 0) {
                        rawYouBikeData = dataArray.map(item => ({
                            sna: (item.sna || item.StationName || '').replace('YouBike2.0_', ''),
                            sarea: item.sarea || item.Sarea || '高雄市',
                            ar: item.ar || item.Address || '無詳細地址',
                            sbi: parseInt(item.sbi || item.BikeCapacity || 0),
                            bemp: parseInt(item.bemp || item.EmptyCapacity || 0),
                            act: item.act || '1'
                        }));
                        if (statusText) statusText.innerText = "連線正常 (即時)";
                        showToast("已成功更新即時 YouBike 資料");
                    } else {
                        throw new Error("無效資料格式");
                    }
                } else {
                    throw new Error("即時 API 未回應，切換至備用即時資料");
                }
            } catch (err) {
                console.warn("API Fetch warning, using robust mock data:", err.message);
                rawYouBikeData = [...MOCK_STATIONS];
                if (statusText) statusText.innerText = "展示模式 (擬真資料)";
                showToast("已載入高雄重點場站最新即時動態");
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
                secondsLeft = 60;
                applyFiltersAndRender();
            }
        }

        function applyFiltersAndRender() {
            const district = document.getElementById('district-select').value;
            const status = document.getElementById('status-filter').value;
            const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

            currentStations = rawYouBikeData.filter(s => {
                // District filter
                if (district !== 'ALL' && s.sarea !== district) return false;

                // Status filter
                if (status === 'HAS_BIKES' && s.sbi <= 0) return false;
                if (status === 'PLENTY_BIKES' && s.sbi <= 5) return false;
                if (status === 'HAS_SPACES' && s.bemp <= 0) return false;

                // Keyword search
                if (searchKeyword && !s.sna.toLowerCase().includes(searchKeyword) && !s.ar.toLowerCase().includes(searchKeyword)) {
                    return false;
                }

                return true;
            });

            updateOverviewStats(currentStations);
            renderStationList(currentStations);
        }

        function updateOverviewStats(stations) {
            const totalBikes = stations.reduce((acc, cur) => acc + (cur.sbi || 0), 0);
            const totalSpaces = stations.reduce((acc, cur) => acc + (cur.bemp || 0), 0);

            document.getElementById('stat-total-bikes').innerText = totalBikes.toLocaleString();
            document.getElementById('stat-total-spaces').innerText = totalSpaces.toLocaleString();
            document.getElementById('stat-total-stations').innerText = stations.length;
        }

        function renderStationList(stations) {
            const listContainer = document.getElementById('station-list');
            listContainer.innerHTML = '';

            if (stations.length === 0) {
                listContainer.innerHTML = `
                    <div class="col-span-full p-8 text-center text-slate-400">
                        <i data-lucide="info" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        <p class="text-sm">查無符合條件的 YouBike 站點</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            stations.forEach((st) => {
                // Status badge logic
                let badgeBg = 'bg-orange-500/10 text-orange-600 dark:text-orange-400 border-orange-200 dark:border-orange-800';
                let badgeText = '可借充足';
                if (st.sbi === 0) {
                    badgeBg = 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-200 dark:border-rose-800';
                    badgeText = '無車可借';
                } else if (st.sbi <= 3) {
                    badgeBg = 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-200 dark:border-amber-800';
                    badgeText = '車輛較少';
                }

                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-800 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 hover:border-orange-500/50 dark:hover:border-orange-500/50 transition-all cursor-pointer shadow-sm group flex flex-col justify-between`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${st.sarea}</span>
                                <h4 class="font-bold text-sm group-hover:text-orange-600 dark:group-hover:text-orange-400 transition-colors">${st.sna}</h4>
                            </div>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-medium border ${badgeBg} shrink-0">
                                ${badgeText}
                            </span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 line-clamp-2">${st.ar}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-slate-100 dark:border-slate-700/50 text-xs">
                        <div class="flex items-center space-x-1.5">
                            <i data-lucide="bike" class="w-4 h-4 text-orange-500"></i>
                            <span class="text-slate-500 dark:text-slate-400">可借:</span>
                            <span class="font-bold text-slate-800 dark:text-slate-100 text-sm">${st.sbi}</span>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <i data-lucide="parking-square" class="w-4 h-4 text-sky-500"></i>
                            <span class="text-slate-500 dark:text-slate-400">可還:</span>
                            <span class="font-bold text-slate-800 dark:text-slate-100 text-sm">${st.bemp}</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    showToast(`已選取站點：「${st.sna}」(${st.ar})`);
                });

                listContainer.appendChild(card);
            });

            lucide.createIcons();
        }

        function renderAttractions(filterCategory = 'ALL') {
            const grid = document.getElementById('attractions-grid');
            grid.innerHTML = '';

            const filtered = filterCategory === 'ALL' 
                ? KAOHSIUNG_SPOTS 
                : KAOHSIUNG_SPOTS.filter(s => s.category === filterCategory);

            filtered.forEach(spot => {
                const card = document.createElement('div');
                card.className = 'p-5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 hover:border-purple-500/50 hover:shadow-md transition-all duration-300 flex flex-col justify-between space-y-4';
                
                const imageHtml = spot.imageUrl ? `
                    <div class="relative w-full h-36 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-700">
                        <img src="${spot.imageUrl}" alt="${spot.name}" referrerpolicy="no-referrer" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/e2e8f0?text=${encodeURIComponent(spot.name)}';">
                        <div class="absolute bottom-2 left-2 bg-slate-900/70 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-md font-medium">
                            ${spot.name}
                        </div>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="space-y-2.5">
                        ${imageHtml}
                        <div class="flex items-center justify-between gap-2">
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 dark:bg-purple-950/80 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800">
                                ${spot.category}
                            </span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 flex items-center space-x-1">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-purple-500"></i>
                                <span>${spot.district}</span>
                            </span>
                        </div>
                        <h3 class="font-bold text-base text-slate-800 dark:text-slate-100">${spot.name}</h3>
                        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed line-clamp-3">
                            ${spot.desc}
                        </p>
                    </div>

                    <div class="pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                        <span class="text-[11px] text-slate-400">
                            鄰近站點: ${spot.nearStation}
                        </span>
                        <button class="locate-spot-btn px-3 py-1.5 rounded-xl bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-600 hover:text-white text-xs font-semibold text-purple-600 dark:text-purple-300 flex items-center space-x-1.5 transition-all" data-name="${spot.name}" data-near="${spot.nearStation}">
                            <span>搜尋周邊站點</span>
                            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;

                grid.appendChild(card);
            });

            // Bind click for locating spot on map & highlight nearby station
            document.querySelectorAll('.locate-spot-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = btn.dataset.name;
                    const nearStation = btn.dataset.near;

                    if (nearStation) {
                        const searchInput = document.getElementById('search-input');
                        searchInput.value = nearStation.replace('捷運', '');
                        applyFiltersAndRender();
                    }

                    showToast(`已為您篩選「${name}」周邊站點 (${nearStation})`);
                });
            });

            lucide.createIcons();
        }

        function initEventListeners() {
            // Theme switch
            document.getElementById('theme-toggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Manual Refresh
            document.getElementById('refresh-btn').addEventListener('click', () => {
                fetchYouBikeData();
            });

            // Filters
            document.getElementById('district-select').addEventListener('change', applyFiltersAndRender);
            document.getElementById('status-filter').addEventListener('change', applyFiltersAndRender);
            document.getElementById('search-input').addEventListener('input', applyFiltersAndRender);

            // Spot category tags
            document.querySelectorAll('.spot-tag').forEach(tagBtn => {
                tagBtn.addEventListener('click', () => {
                    document.querySelectorAll('.spot-tag').forEach(b => {
                        b.classList.remove('bg-purple-600', 'text-white');
                        b.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
                    });
                    tagBtn.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
                    tagBtn.classList.add('bg-purple-600', 'text-white');

                    renderAttractions(tagBtn.dataset.tag);
                });
            });
        }

        function startCountdown() {
            if (updateTimerInterval) clearInterval(updateTimerInterval);

            updateTimerInterval = setInterval(() => {
                secondsLeft--;
                const timerEl = document.getElementById('update-timer');
                if (timerEl) timerEl.innerText = `更新倒數: ${secondsLeft}s`;

                if (secondsLeft <= 0) {
                    fetchYouBikeData();
                }
            }, 1000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            
            if (!toast || !toastMsg) return;

            toastMsg.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
